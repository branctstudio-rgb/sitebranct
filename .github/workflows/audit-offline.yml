name: Offline audit contract

on:
  pull_request:
    paths:
      - "docs/audit/**"
      - "fixtures/audit/**"
      - "tests/audit/**"
      - ".github/workflows/audit-offline.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/governance/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    timeout-minutes: 15
    env:
      AUDIT_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
      F2_01_CONTAINER_DIGEST: sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate offline audit contract
        run: node --test tests/audit/site-audit.test.mjs
      - name: Verify F2-01 readiness in Chromium, Firefox and WebKit
        run: node scripts/governance/verify-f2-01-readiness.mjs
      - name: Reproduce browser baseline
        run: node tests/audit/collect-browser-baseline.mjs --check fixtures/audit/baseline-results.json
      - name: Reject empty visual evidence
        run: node tests/audit/check-visual-evidence.mjs
