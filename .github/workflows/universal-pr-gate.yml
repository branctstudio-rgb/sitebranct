name: Universal PR Gate Candidate

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: universal-pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  universal-pr-gate:
    name: Universal PR Gate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    timeout-minutes: 30
    env:
      F2_01_CONTAINER_DIGEST: sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      AUDIT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Trust only the mounted checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Prepare Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install exact base-locked dependencies in trusted isolation
        shell: bash
        run: |
          set -euo pipefail
          trusted_deps="$RUNNER_TEMP/branct-base-dependencies"
          test ! -e "$trusted_deps"
          mkdir -m 700 "$trusted_deps"
          git cat-file blob "${BASE_SHA}:package.json" > "$trusted_deps/package.json"
          git cat-file blob "${BASE_SHA}:package-lock.json" > "$trusted_deps/package-lock.json"
          npm ci --ignore-scripts --prefix "$trusted_deps"
          test -d "$trusted_deps/node_modules/playwright"
          test ! -e "$GITHUB_WORKSPACE/node_modules"
          ln -s "$trusted_deps/node_modules" "$GITHUB_WORKSPACE/node_modules"
          echo "F2_GOV_TRUSTED_NODE_MODULES=$trusted_deps/node_modules" >> "$GITHUB_ENV"

      - name: Run base-only F2-GOV-08 enforcement
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$RUNNER_TEMP/branct-base-authority"
          test ! -e "$bootstrap"
          mkdir -m 700 "$bootstrap"
          git cat-file blob "${BASE_SHA}:scripts/governance/validate-f2-gov-08.mjs" > "$bootstrap/validate-f2-gov-08.mjs"
          if [ "$BASE_SHA" = "3656d57a78b777b1ff279c2cda01905877611117" ] && ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/gate-integrity-sentinel.yml \
            .github/workflows/universal-pr-gate.yml \
            fixtures/audit/f2-gov-08-authority-manifest.json \
            fixtures/audit/f2-gov-08-base-only-contract.json \
            fixtures/audit/f2-gov-08-expectations.json \
            fixtures/audit/f2-gov-08-matrix.json \
            scripts/governance/f2-gov-08-consumer.mjs \
            scripts/governance/f2-gov-08-static-server.mjs \
            scripts/governance/validate-f2-gov-08.mjs; then
            node scripts/governance/validate-f2-gov-08.mjs \
              --candidate-evolution \
              --repository "$GITHUB_WORKSPACE" \
              --event-path "$GITHUB_EVENT_PATH" \
              --trusted-node-modules "$F2_GOV_TRUSTED_NODE_MODULES"
          else
            node "$bootstrap/validate-f2-gov-08.mjs" \
              --repository "$GITHUB_WORKSPACE" \
              --event-path "$GITHUB_EVENT_PATH" \
              --trusted-node-modules "$F2_GOV_TRUSTED_NODE_MODULES"
          fi

      - name: Classify changed paths fail closed
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.z"
          node scripts/governance/classify-pr-paths.mjs \
            --input "$RUNNER_TEMP/changed-paths.z" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate universal gate contract
        run: node --test tests/audit/f2-gov-02a.test.mjs

      - name: Validate gate correction contract
        run: node --test tests/audit/f2-gov-02c.test.mjs

      - name: Validate governance contracts
        run: node --test tests/audit/phase-2-governance.test.mjs tests/audit/f2-gov-01.test.mjs

      - name: Validate deploy protection and exact payload
        run: node --test tests/deploy/deploy-scope.test.mjs

      - name: Validate integrated audit contract
        if: steps.classify.outputs.run_audit == 'true'
        run: node --test tests/audit/site-audit.test.mjs

      - name: Verify F2-01 readiness in Chromium, Firefox and WebKit
        env:
          HOME: /root
        run: node scripts/governance/verify-f2-01-readiness.mjs

      - name: Reproduce browser baseline
        if: always() && steps.classify.outputs.run_browser == 'true'
        run: node tests/audit/collect-browser-baseline.mjs --check fixtures/audit/baseline-results.json

      - name: Reject empty visual evidence
        if: always() && steps.classify.outputs.run_visual == 'true'
        run: node tests/audit/check-visual-evidence.mjs

      - name: Gate terminal result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Universal PR Gate: SUCCESS"
          else
            echo "Universal PR Gate: FAILURE"
            exit 1
          fi
