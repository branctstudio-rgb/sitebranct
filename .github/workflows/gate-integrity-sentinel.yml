name: Gate Integrity Sentinel

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gate-integrity-sentinel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-integrity-sentinel:
    name: Gate Integrity Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public PR file metadata from the base workflow
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https = require("node:https");

          (async () => {

          const repository = process.env.REPOSITORY;
          const pullNumber = process.env.PR_NUMBER;
          const changedFiles = process.env.CHANGED_FILES;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository ?? "")) throw new Error("invalid repository metadata");
          if (!/^[1-9][0-9]*$/.test(pullNumber ?? "")) throw new Error("invalid pull request metadata");
          if (!/^[1-9][0-9]*$/.test(changedFiles ?? "") || Number(changedFiles) > 3000) throw new Error("invalid changed-files metadata");

          const requestPage = (page) => new Promise((resolve, reject) => {
            const request = https.get({
              hostname: "api.github.com",
              path: `/repos/${repository}/pulls/${pullNumber}/files?per_page=100&page=${page}`,
              headers: { Accept: "application/vnd.github+json", "User-Agent": "branct-gate-integrity-sentinel" },
            }, (response) => {
              let body = "";
              response.setEncoding("utf8");
              response.on("data", (chunk) => { body += chunk; });
              response.on("end", () => {
                if (response.statusCode !== 200) return reject(new Error(`public metadata request failed: HTTP ${response.statusCode}`));
                try { resolve({ items: JSON.parse(body), link: response.headers.link ?? "" }); } catch { reject(new Error("public metadata response is not valid JSON")); }
              });
            });
            request.setTimeout(15000, () => request.destroy(new Error("public metadata request timed out")));
            request.on("error", reject);
          });

          const protectedPaths = new Set([
            ".github/workflows/audit-offline.yml",
            ".github/workflows/deploy.yml",
            ".github/workflows/universal-pr-gate.yml",
            ".github/workflows/gate-integrity-sentinel.yml",
            "deploy/publish-manifest.json",
            "docs/audit/evidence/red-green.md",
            "docs/audit/phase-1-audit.md",
            "docs/audit/risk-register.md",
            "docs/audit/target-architecture-roadmap.md",
            "docs/audit/phase-2/component-catalog.md",
            "docs/audit/phase-2/f2-00-contract.json",
            "docs/audit/phase-2/f2-01-implementation-plan.md",
            "docs/audit/phase-2/f2-01-specification.md",
            "docs/audit/phase-2/governance-decision.md",
            "docs/audit/phase-2/visual-constitution.md",
            "docs/deploy-protection/scope-matrix.md",
            "fixtures/audit/baseline-results.json",
            "fixtures/audit/evidence-manifest.json",
            "fixtures/audit/f2-gov-01-current-state.json",
            "fixtures/audit/f2-gov-01-ruleset-proposal.json",
            "fixtures/audit/f2-gov-02a-path-matrix.json",
            "fixtures/audit/f2-gov-02b-observed-results.json",
            "fixtures/audit/f2-gov-02b-trial-contract.json",
            "fixtures/audit/f2-gov-02c-expected-results.json",
            "fixtures/audit/invalid-home-390x844.jpg",
            "fixtures/audit/site-contract.json",
            "fixtures/audit/visual-negative-control.json",
            "scripts/deploy/build-publish-payload.mjs",
            "scripts/governance/classify-pr-paths.mjs",
            "tests/audit/check-visual-evidence.mjs",
            "tests/audit/collect-browser-baseline.mjs",
            "tests/audit/f2-gov-01.test.mjs",
            "tests/audit/f2-gov-02a.test.mjs",
            "tests/audit/f2-gov-02c.test.mjs",
            "tests/audit/phase-2-governance.test.mjs",
            "tests/audit/site-audit.test.mjs",
            "tests/deploy/deploy-scope.test.mjs",
            "docs/audit/evidence/baseline/crm-gestao-desktop.jpg",
            "docs/audit/evidence/baseline/crm-gestao-mobile.jpg",
            "docs/audit/evidence/baseline/crm-gestao-tablet.jpg",
            "docs/audit/evidence/baseline/home-1024x768.jpg",
            "docs/audit/evidence/baseline/home-1440x900-viewport.jpg",
            "docs/audit/evidence/baseline/home-1440x900.jpg",
            "docs/audit/evidence/baseline/home-360x800.jpg",
            "docs/audit/evidence/baseline/home-390x844-viewport.jpg",
            "docs/audit/evidence/baseline/home-390x844.jpg",
            "docs/audit/evidence/baseline/home-768x1024.jpg",
            "docs/audit/evidence/baseline/website-premium-desktop.jpg",
            "docs/audit/evidence/baseline/website-premium-mobile.jpg",
            "docs/audit/evidence/baseline/website-premium-tablet.jpg",
          ]);

          const files = [];
          let recordCount = 0;
          for (let page = 1; ; page += 1) {
            if (page > 30) throw new Error("PR file list exceeds the fail-closed API limit");
            const response = await requestPage(page);
            const batch = response.items;
            if (!Array.isArray(batch)) throw new Error("public metadata response must be an array");
            const links = [...response.link.matchAll(/<([^>]+)>; rel="([^"]+)"/g)];
            if (response.link && links.length === 0) throw new Error("incomplete pagination metadata");
            const hasNext = links.some(([, , relation]) => relation === "next");
            if (batch.length < 100 && hasNext) throw new Error("contradictory pagination metadata");
            for (const item of batch) {
              if (!item || typeof item.filename !== "string" || typeof item.status !== "string") throw new Error("malformed PR file metadata");
              files.push(item.filename);
              recordCount += 1;
              if (item.status === "renamed") {
                if (typeof item.previous_filename !== "string") throw new Error("malformed rename metadata");
                files.push(item.previous_filename);
              }
            }
            if (!hasNext) break;
          }
          if (recordCount !== Number(changedFiles)) throw new Error("file count does not match pull request metadata");
          if (files.length === 0) throw new Error("PR file list is empty");
          const protectedChanges = [...new Set(files.filter((path) => protectedPaths.has(path)))].sort();
          if (protectedChanges.length) throw new Error(`protected gate component changed: ${protectedChanges.join(", ")}`);
          console.log(`Gate Integrity Sentinel: PASS (${files.length} public file records inspected)`);
          })().catch((error) => {
            console.error(`Gate Integrity Sentinel: FAILURE — ${error.message}`);
            process.exitCode = 1;
          });
          NODE
