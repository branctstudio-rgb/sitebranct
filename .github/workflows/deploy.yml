name: Deploy para Hostinger (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # O repo fica legivel; so a copia enviada por FTP e minificada.
      # Se a minificacao falhar, o deploy segue com os ficheiros originais.
      - name: Minificar CSS/JS ativos
        run: |
          npx --yes esbuild src/css/branct.css --minify --allow-overwrite --outfile=src/css/branct.css || echo "minify branct.css falhou - segue sem minificar"
          npx --yes esbuild src/js/branct.js --minify --allow-overwrite --outfile=src/js/branct.js || echo "minify branct.js falhou - segue sem minificar"
          npx --yes esbuild src/js/trial.js --minify --allow-overwrite --outfile=src/js/trial.js || echo "minify trial.js falhou - segue sem minificar"

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp mirror)
        env:
          FTP_USER: ${{ secrets.SSH_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.SSH_HOST }}
        run: |
          lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST};
            mirror --reverse --delete --verbose --parallel=5 \
              --exclude ^APP/ \
              --exclude ^n8n/ \
              --exclude ^testecliente/ \
              --exclude ^\.git/ \
              --exclude ^\.github/ \
              --exclude ^node_modules/ \
              --exclude ^\.vscode/ \
              --exclude ^\.claude/ \
              --exclude ^\.superpowers/ \
              --exclude ^docs/ \
              --exclude ^supabase/ \
              --exclude ^AUDIT\.md$ \
              --exclude ^CLAUDE\.md$ \
              --exclude ^src/models/ \
              --exclude ^src/3d/ \
              --exclude ^src/img/video\.mp4$ \
              --exclude ^\.gitignore$ \
              --exclude ^package\.json$ \
              --exclude ^package-lock\.json$ \
              --exclude ^CHANGELOG-3D-FIX\.md$ \
              --exclude ^GEMINI-FIXES-APPLIED\.md$ \
              --exclude ^MELHORIAS-SUGERIDAS\.md$ \
              --exclude ^MOCKUP-IMPLEMENTATION\.md$ \
              ./ /domains/branct.com/public_html/;
            quit
          "

      - name: Deploy concluido
        run: echo "Deploy realizado com sucesso! Pastas APP/, n8n/ e testecliente/ preservadas."
